# Publishes the container image to ghcr.io. Without this, the README's promised
# "one command" is actually "compile a Rust release build with LTO on your own machine
# for twenty minutes, after first managing to pull the rust/node base images".
name: Release

on:
  push:
    tags: ["v*"]
  # Use this to produce a deployable image before formally tagging a release
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0-rc5)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # **A pre-release must not move latest.** The two `{{major}}.{{minor}}` lines
            # are skipped for pre-releases by metadata-action itself, but this raw line
            # isn't — pushing a `v0.1.0-rc1` would drag latest along with it, which is
            # exactly what an rc is supposed to avoid. The test is whether the tag
            # contains a hyphen: that's how semver marks a pre-release.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      # First just load it locally and run it. "The image built successfully" doesn't prove
      # "the container can start" — a glibc mismatch across distros builds all-green and
      # then dies on startup.
      # amd64 only: arm64 would need QEMU, and a Rust release build with LTO would stretch
      # past an hour.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: utopia:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — boot it, migrate, register a user
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=utopia -e POSTGRES_PASSWORD=utopia -e POSTGRES_DB=utopia \
            pgvector/pgvector:pg16
          # Every polling condition goes inside the if: under set -e, `cmd && break` would
          # abort the whole script the moment cmd fails, turning "not ready yet" into
          # "build failed".
          for _ in $(seq 1 40); do
            if docker exec pg pg_isready -U utopia -d utopia >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # Deliberately not setting UTOPIA_JWT_SECRET: this run exercises the
          # auto-generation path. The registration request below signs and carries a
          # token, so it won't pass if the secret wasn't generated correctly.
          docker run -d --name app --network smoke -p 1516:1516 \
            -e UTOPIA_DATABASE_URL=postgres://utopia:utopia@pg:5432/utopia \
            utopia:smoke

          # Must hit /api/v1/health and check the JSON: the health check lives under the
          # nest("/api/v1") scope, and the image ships an SPA fallback — requesting /health
          # would get a 200 index.html back, which looks like a pass.
          ok=""
          for _ in $(seq 1 40); do
            if curl -sf -m 3 http://localhost:1516/api/v1/health -o /tmp/h.json \
               && grep -q '"status":"ok"' /tmp/h.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "::error::container never became healthy"; docker logs app; exit 1; fi

          # Register once, to genuinely exercise the whole migrations + argon2 + JWT
          # issuance chain
          code=$(curl -s -o /tmp/reg.json -w '%{http_code}' -m 10 \
            -X POST http://localhost:1516/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-password-123","display_name":"Smoke"}')
          if [ "$code" != "200" ]; then
            echo "::error::register returned $code"; cat /tmp/reg.json; docker logs app; exit 1
          fi
          grep -q '"token"' /tmp/reg.json || { echo "::error::no token issued"; cat /tmp/reg.json; exit 1; }
          echo "smoke test passed: healthy, migrated, user registered, token issued"

      # Only publish once the smoke test passes. The cache is already warm, so this step is
      # essentially instant.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
