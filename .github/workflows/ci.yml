name: Arcadia CI

on:
  push:
    branches: [main, dev, arcadia]
  pull_request:

# **Explicitly read-only.** Without this block it inherits the repository-level default,
# and that default has to be read-write for star-history — CI is the workflow that runs
# on every push and every PR, and shouldn't incidentally get write access because
# something else needs it. Declared here, it stays independent of however the repo
# default changes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Backup integrity tests
        run: python3 -m unittest discover -s scripts/arcadia -p 'test_*.py'
      - name: Build
        run: cargo build --workspace

  # Migrations need to actually be run against a database. CI used to only have
  # fmt/clippy/test/build, so two PRs could each ship an 0025, each pass on its own, and
  # after both merged into main the service simply wouldn't start — sqlx indexes by
  # version number, and **the merged state was never run by any CI job**.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: utopia
          POSTGRES_PASSWORD: utopia
          POSTGRES_DB: utopia
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # A colliding number isn't a file-level conflict, so git merges it cleanly — it can
      # only be caught by checking explicitly
      - name: Migration version numbers must not repeat
        run: |
          dupes=$(ls migrations/ | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate migration version numbers: $dupes"
            ls migrations/
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Run once against a fresh database
        run: sqlx migrate run --database-url postgres://utopia:utopia@localhost:5432/utopia
      # The second run must also pass: after renumbering, a migration must replay safely
      # against a database that already ran the old number
      - name: Run again
        run: sqlx migrate run --database-url postgres://utopia:utopia@localhost:5432/utopia
      # This is the only job that can run the database-backed tests — the rust job has no
      # database, so those tests skip there and still show green. Not running them here
      # would mean tests were written but never executed, which is worse than not writing
      # them at all: it makes people believe the SQL has coverage.
      # The whole utopia-store integration suite runs here, and **fails without a database**
      # (UTOPIA_TEST_REQUIRE_DB): it used to be that only graph_changes ran, and the other
      # twenty-odd tests silently skipped in the database-less backend job — the green was
      # fake (#248)
      - name: Database-backed tests
        run: |
          set -o pipefail
          cargo test -p utopia-store -p utopia-server 2>&1 | tee store-tests.log
        env:
          UTOPIA_DATABASE_URL: postgres://utopia:utopia@localhost:5432/utopia
          UTOPIA_TEST_REQUIRE_DB: "1"
      - name: Summary
        if: always()
        run: |
          passed=$(grep -o '[0-9]* passed' store-tests.log | awk '{s+=$1} END {print s+0}')
          failed=$(grep -o '[0-9]* failed' store-tests.log | awk '{s+=$1} END {print s+0}')
          echo "utopia-store against Postgres: **${passed} passed**, ${failed} failed — a missing database fails this job instead of skipping" >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Version comes from the packageManager field in web/package.json — writing it again
      # here would make it a second source of truth, and the two would eventually drift
      # (that's exactly how the image build broke before). package_json_file must be given
      # explicitly: the working-directory above only applies to run steps, while this
      # action looks for package.json at the repo root by default, and the root is the
      # Cargo workspace.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (includes typecheck)
        run: pnpm build
