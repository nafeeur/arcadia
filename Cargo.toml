[workspace]
resolver = "2"
members = [
    "crates/utopia-core",
    "crates/utopia-store",
    "crates/utopia-server",
    "crates/utopia-ingest",
    "crates/utopia-extract",
    "crates/utopia-reason",
    "crates/utopia-search",
    "crates/utopia-llm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nafeeur/arcadia"

[workspace.dependencies]
utopia-core = { path = "crates/utopia-core" }
utopia-store = { path = "crates/utopia-store" }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.8", default-features = false, features = [
    # mysql is only enabled for the Ask-the-Data query engine (query_engine::mysql): one wire
    # protocol happens to cover TiDB / OceanBase / Doris / StarRocks too. The ontology store is
    # always postgres.
    # bigdecimal is the only way to read DECIMAL — the driver blocks DECIMAL from both f64 and
    # String ("floating-point numbers have different semantics"); without it, money columns
    # come back as an entire column of null.
    "runtime-tokio", "tls-rustls", "postgres", "mysql", "bigdecimal", "uuid", "chrono", "json", "migrate", "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = { version = "0.5", features = ["std"] }
# Credential encryption at rest (core::secrets): AES-256-GCM, key never enters the database
aes-gcm = "0.10"
base64 = "0.23"
# Constant-time key comparison (sources' push keys). Already pulled in by the aes-gcm
# dependency tree; listed explicitly.
subtle = "2"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
figment = { version = "0.10", features = ["env"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1"
# Stringifying and iterating enums (source kind `SourceKind`) — hand-maintaining two lists
# in sync is exactly how #247 drifted.
strum = { version = "0.27", features = ["derive"] }

# Phase 1: ingestion / retrieval / LLM
utopia-ingest = { path = "crates/utopia-ingest" }
utopia-reason = { path = "crates/utopia-reason" }
utopia-search = { path = "crates/utopia-search" }
utopia-llm = { path = "crates/utopia-llm" }
tantivy = "0.26"
tantivy-jieba = "0.20"
text-splitter = "0.32"
pdf-extract = "0.12"
calamine = "0.36"
pgvector = { version = "0.4", features = ["sqlx"] }
# `gzip` is not optional: one embeddings response is 64×1024 floats — written as JSON text,
# each number costs 21 bytes for 4 bytes of information, a 1.33 MB response. Measured on the
# same link: 62s uncompressed vs. 21s with gzip (429 KB) — the server itself only takes 1s to
# compute it, the rest is all transfer.
# `default-features = false` turned this off along with everything else; adding it back here.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "http2", "rustls", "webpki-roots", "charset", "system-proxy", "gzip"] }

feed-rs = "2"
cron = "0.12"
infer = "0.22"
sha2 = "0.11"
dom_smoothie = "0.16"
htmd = "0.5"
pulldown-cmark = { version = "0.13", default-features = false }
chardetng = "1"
encoding_rs = "0.8"
quick-xml = "0.42"
zip = { version = "6", default-features = false, features = ["deflate"] }
csv = "1"

# Ontology import: small, focused parsers split out from Oxigraph — parsing only, no
# reasoning. We don't need a full OWL reasoner like horned-owl; the projection only consumes
# RDF triples.
oxttl = "0.2"
oxrdfxml = "0.2"
oxrdf = "0.3"
oxrdfio = "0.2"
async-stream = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
tempfile = "3"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
