services:
  db:
    # If you can't pull from Docker Hub, override with UTOPIA_DB_IMAGE to any PG16+ image with pgvector
    image: ${UTOPIA_DB_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: ${UTOPIA_DB_PASSWORD:-utopia}
      POSTGRES_DB: utopia
      # Password for the restricted runtime role the app connects as. The role is only created if this is set; otherwise the app still runs as the owner.
      UTOPIA_APP_DB_PASSWORD: ${UTOPIA_APP_DB_PASSWORD:-}
    ports:
      # Avoid 5432 on the host side: dev machines often have a local PG already sitting on
      # that port, and colliding with it means the container fails to start. And whoever
      # collided with it can't use their own PG anyway — it almost certainly lacks pgvector.
      # Still 5432 inside the container (the PG standard; that's what the app connects to
      # over the compose network).
      #
      # Loopback-only: this port mapping exists purely for local development (so `cargo run`
      # on the host can connect). Binding 0.0.0.0 would expose a default-password database
      # to the public network.
      - "${UTOPIA_DB_BIND:-127.0.0.1:1517}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Creates the restricted role on first initialization only; deployments with an existing
      # data directory won't run this and need to create it manually once (see the upgrade
      # notes in the README). Permissions are granted by migration 0031, not here.
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utopia -d utopia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full deployment: docker compose --profile app up -d
  # For local development, start only db and run the app with cargo run
  #
  # Build this Arcadia fork locally; no upstream application image is used.
  app:
    image: ${ARCADIA_IMAGE:-arcadia:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["app"]
    environment:
      # Runs as the owner by default. To enable the restricted role (free read/write on
      # business tables, append-only on the ledger), set both of the two variables below
      # in .env — see .env.example. They're written separately rather than as a conditional
      # substitution, because that kind of nested substitution is unreadable and a mistake
      # in it wouldn't be traceable.
      UTOPIA_DATABASE_URL: ${UTOPIA_DATABASE_URL:-postgres://utopia:${UTOPIA_DB_PASSWORD:-utopia}@db:5432/utopia}
      UTOPIA_MIGRATION_URL: ${UTOPIA_MIGRATION_URL:-}
      UTOPIA_BIND_ADDR: 0.0.0.0:1516
      ARCADIA_OIDC_ISSUER: ${ARCADIA_OIDC_ISSUER:-}
      ARCADIA_OIDC_CLIENT_ID: ${ARCADIA_OIDC_CLIENT_ID:-}
      ARCADIA_OIDC_CLIENT_SECRET: ${ARCADIA_OIDC_CLIENT_SECRET:-}
      ARCADIA_OIDC_REDIRECT_URI: ${ARCADIA_OIDC_REDIRECT_URI:-}
      # Leave blank: one is auto-generated into deployment_settings on first start. Giving
      # a default value here would mean that auto-generation path never triggers, and every
      # deployment would end up sharing the same well-known secret.
      UTOPIA_JWT_SECRET: ${UTOPIA_JWT_SECRET:-}
      UTOPIA_SECRET_KEY: ${UTOPIA_SECRET_KEY:-}
      UTOPIA_WEB_DIST: /app/web-dist
      UTOPIA_DATA_DIR: /app/data
      # Connection pool ceiling. Defaults to 32, aligned with the default worker concurrency;
      # when the pool is smaller than concurrency the symptom is requests slowing down, not
      # an error saying the pool is too small — so remember this when tuning concurrency up.
      # Before raising it, confirm Postgres's own max_connections (default 100) can hold it.
      UTOPIA_DB_MAX_CONNECTIONS: ${UTOPIA_DB_MAX_CONNECTIONS:-32}
    volumes:
      # Raw files (files/) and the full-text index (index/). Without this mount, they
      # disappear on every container rebuild while the `documents` rows in the database
      # remain — every reference silently breaks with no error.
      # Backup = this directory + the database.
      - ./data:/app/data
    ports:
      - "1516:1516"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
