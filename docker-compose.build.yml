# Build from source, layered on top of docker-compose.yml — use this when you've changed
# code, or want to run an unreleased version:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --profile app up -d --build
#
# A normal deployment doesn't need this file; just run docker compose --profile app up -d
# to pull the pre-built image.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
